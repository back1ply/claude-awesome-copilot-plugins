name: Sync port

# Merges upstream github/awesome-copilot, regenerates claude-plugins/, pushes.
# Opens an issue instead of pushing when the merge needs a human.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Without this, `gh` prefers the remote named "upstream" over "origin"
      # and would target github/awesome-copilot, where this token has no access.
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      # This fork keeps none of upstream's 42 workflows — they publish sites,
      # call webhooks and run agentic jobs that must not fire from here.
      KEEP_WORKFLOW: sync-port.yml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config core.editor true
          # .gitattributes maps README.md to this driver: upstream regenerates
          # its own README every release, and ours must survive the merge.
          git config merge.ours.driver true

      - name: Fetch upstream
        id: fetch
        run: |
          git remote add upstream https://github.com/github/awesome-copilot.git
          git fetch --quiet upstream main
          echo "sha=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            echo "behind=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        id: merge
        if: steps.fetch.outputs.behind == 'true'
        run: |
          set -o pipefail
          if git merge --no-edit upstream/main; then
            echo "Merged cleanly."
          else
            # Only two conflict classes are auto-resolvable: workflows we
            # deliberately deleted, and our README. Anything else is a real
            # conflict a human has to look at.
            conflicts=$(git diff --name-only --diff-filter=U)
            unexpected=$(echo "$conflicts" | grep -vE '^(\.github/workflows/|README\.md$)' || true)
            if [ -n "$unexpected" ]; then
              git merge --abort
              echo "unexpected<<EOF" >> "$GITHUB_OUTPUT"
              echo "$unexpected" >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "$conflicts" | grep '^\.github/workflows/' | xargs -r git rm -rq --ignore-unmatch
            if echo "$conflicts" | grep -q '^README\.md$'; then
              git checkout --ours README.md && git add README.md
            fi
            git commit --no-edit
          fi

      - name: Open issue on merge conflict
        if: failure() && steps.merge.outcome == 'failure'
        run: |
          gh issue create \
            --title "Upstream merge needs manual resolution (${{ steps.fetch.outputs.sha }})" \
            --body "$(printf 'Automatic sync stopped: merging upstream/main conflicts in files this workflow will not resolve on its own.\n\nConflicting paths:\n```\n%s\n```\n\nResolve locally:\n```\ngit fetch upstream main\ngit merge upstream/main\nnode scripts/sync.mjs\n```\n' '${{ steps.merge.outputs.unexpected }}')"

      - name: Drop inherited upstream workflows
        run: find .github/workflows -type f ! -name "$KEEP_WORKFLOW" -delete

      - name: Regenerate port
        id: generate
        run: |
          node scripts/sync.mjs | tee /tmp/sync.log
          grep '^Generated' /tmp/sync.log >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream: \`${{ steps.fetch.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to push."
            exit 0
          fi
          git add -A
          git commit -m "chore: sync port with upstream ${{ steps.fetch.outputs.sha }}" \
            -m "Regenerated by .github/workflows/sync-port.yml."
          git push origin HEAD:main
